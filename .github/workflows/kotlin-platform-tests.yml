name: Kotlin platform tests

on:
  push:
    paths:
      - 'kotlin/**'
      - '.github/workflows/kotlin-platform-tests.yml'
  pull_request:
    paths:
      - 'kotlin/**'
      - '.github/workflows/kotlin-platform-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: ':PixelPass:jvmTest :PixelPass:testDebugUnitTest'
          # No Android SDK on Linux ARM; jvmTest is finalized by the Jacoco task, which depends on the Android tests.
          - os: ubuntu-24.04-arm
            tasks: ':PixelPass:jvmTest -x :PixelPass:jacocoMergedReport'
          - os: macos-latest
            tasks: ':PixelPass:jvmTest :PixelPass:testDebugUnitTest'
          - os: macos-15-intel
            tasks: ':PixelPass:jvmTest :PixelPass:testDebugUnitTest'
          - os: windows-latest
            tasks: ':PixelPass:jvmTest :PixelPass:testDebugUnitTest'
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew ${{ matrix.tasks }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: kotlin/PixelPass/build/reports/tests