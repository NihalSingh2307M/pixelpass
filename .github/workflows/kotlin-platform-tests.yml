name: Kotlin platform tests

on:
  push:
    paths:
      - 'kotlin/**'
      - '.github/workflows/kotlin-platform-tests.yml'
  pull_request:
    paths:
      - 'kotlin/**'
      - '.github/workflows/kotlin-platform-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM and Android unit tests
        run: ./gradlew :PixelPass:jvmTest :PixelPass:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: kotlin/PixelPass/build/reports/tests